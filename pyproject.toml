[project]
name = "jobpilot"
version = "0.1.0"
description = "CV Autopilot Agent — crawl dev jobs, tailor CV, apply (hybrid). See PLAN.md."
requires-python = ">=3.11"

# Base deps = Phase 0 only (config). Everything else is an opt-in extra so a
# minimal install stays minimal. Install a phase's extra when you reach it.
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
data = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]   # Phase 2
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]                    # Phase 2
crawler = ["playwright>=1.43", "httpx>=0.27", "beautifulsoup4>=4.12"]  # Phase 3
cv = ["jinja2>=3.1", "pypdf>=4.0"]                                    # Phase 4.5 (CV Studio)
tailor = ["anthropic>=0.25"]                                          # Phase 5
# Phase 7. httpx: the Slack app calls the REST API rather than the DB;
# websockets: it mirrors live events from the API's /ws.
slack = ["slack-bolt>=1.18", "httpx>=0.27", "websockets>=12.0"]
all = ["jobpilot[data,api,crawler,cv,tailor,slack]"]
# httpx: FastAPI TestClient + robots fetch; beautifulsoup4: crawler parser tests;
# jinja2/pypdf: CV render + page-count tests.
dev = [
  "pytest>=8.0", "ruff>=0.4", "black>=24.0",
  "httpx>=0.27", "beautifulsoup4>=4.12", "jinja2>=3.1", "pypdf>=4.0",
]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
# Ship config.yaml and the Jinja2 CV templates. No CV content: personal data
# lives in the database, never in the package.
jobpilot = ["config.yaml", "cv/templates/*/*.j2"]

[tool.pytest.ini_options]
testpaths = ["jobpilot/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
