[project]
name = "jobpilot"
version = "0.1.0"
description = "CV Autopilot Agent — crawl dev jobs, tailor CV, apply (hybrid). See PLAN.md."
requires-python = ">=3.11"

# Base deps = Phase 0 only (config). Everything else is an opt-in extra so a
# minimal install stays minimal. Install a phase's extra when you reach it.
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
data = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]   # Phase 2
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]                    # Phase 2
crawler = ["playwright>=1.43", "httpx>=0.27", "beautifulsoup4>=4.12"]  # Phase 3
tailor = ["anthropic>=0.25", "jinja2>=3.1"]                           # Phase 5
slack = ["slack-bolt>=1.18"]                                          # Phase 7
all = ["jobpilot[data,api,crawler,tailor,slack]"]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
# Ship config.yaml inside the wheel so non-editable installs can load it.
jobpilot = ["config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
